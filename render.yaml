# Blueprint de Render (plan free). Base de datos: Neon (gratis, no vence), ver DEPLOY.md.
services:
  - type: web
    name: inventiq-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npm run migrate:deploy && npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: DATABASE_URL
        sync: false # connection string de Neon
      - key: CORS_ORIGIN
        sync: false # URL del frontend, ej. https://inventiq-web.onrender.com

  - type: web
    name: inventiq-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_URL
        sync: false # ej. https://inventiq-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
